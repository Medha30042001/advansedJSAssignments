<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>Prefrontal Cortex</li>
        <li>Amygdala</li>
        <li>Cerebral Fluid</li>
    </ul>
    <input id="itemInput" placeholder="Enter new Item">
    <button onclick="newItem()">New Item</button>
</body>
<script>
    document.querySelector("button").onclick = function newItem(){
        let newLi = document.createElement("li");
        newLi.textContent = document.getElementById("itemInput").value.trim();
        document.querySelector("ul").appendChild(newLi);

        if(newLi.textContent === "") return;
        
        let count = document.querySelectorAll("ul li").length;

        if(count % 2 === 1){
            newLi.style.fontWeight = "bold";
            newLi.style.color = 'blue';
        }else{
            newLi.style.fontStyle = 'italic';
            newLi.style.color = 'red';
        }

        document.getElementById("itemInput").value = "";
        document.getElementById("itemInput").focus();

        
    }
</script>
</html>
