<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="addPara">Add Paragraph</button>
    <button id="remPara">Remove Last Paraagraph</button>
    <br>
    <div id="container"></div>
</body>
<script>
    //when the add paragraph button is clicked
    //we create a new node using createElement()
    //then we give this new node text content
    //we now append this new node to the existing div element
    document.getElementById("addPara").addEventListener("click", ()=>{
        let newPara = document.createElement("p");
        newPara.textContent = "This is a new paragraph";
        let container = document.getElementById("container");

        container.appendChild(newPara);
    });

    //when we click the remove last paragraph button
    //we first check if there is a last element in the div
    //then we use removeChild() to remove the last element from div
    document.getElementById("remPara").addEventListener("click", ()=>{
        let container = document.getElementById("container");

        if(container.lastElementChild){
            container.removeChild(container.lastElementChild);
        }
    });
</script>
</html>
